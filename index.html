<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physics Questionbank</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%231b2a4a%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2215%22 font-family=%22Arial%22 font-weight=%22700%22 fill=%22%23e8a33d%22 text-anchor=%22middle%22%3EIB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="Afficher les thèmes">☰</button>
    <div class="brand">
      <span class="brand-mark">IB</span>
      <div>
        <div class="brand-title">Physics Questionbank</div>
        <div class="brand-sub">DP Physics · première évaluation 2025</div>
      </div>
    </div>
    <nav class="paper-tabs" id="paperTabs">
      <button data-paper="p1a">Paper 1A <small>QCM</small></button>
      <button data-paper="p2">Paper 2</button>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">Programme</div>
      <ul class="tree" id="tree"></ul>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <div class="crumbs" id="crumbs"></div>
      <section class="filters">
        <input type="search" id="search" placeholder="Rechercher dans les questions…">
        <div class="seg" id="levelSeg">
          <button data-level="">SL + HL</button>
          <button data-level="SL">SL</button>
          <button data-level="HL">HL</button>
        </div>
        <select id="session"><option value="">Toutes les sessions</option></select>
        <label class="check"><input type="checkbox" id="shuffle"> Mélanger</label>
      </section>
      <div class="stats" id="stats"></div>
      <div id="list" class="list"></div>
      <div class="more-wrap"><button id="more" class="more">Afficher plus</button></div>
      <div id="loading" class="loading">Chargement des questions…</div>
    </main>
  </div>

  <script src="data/syllabus.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
